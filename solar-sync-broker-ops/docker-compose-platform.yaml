services:
  mysql-server:
    image: mysql:8.4
    container_name: mysql_server
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?seteaza DB_PASSWORD in .env}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  solar-sync-app:
    image: sebi123q/solarsyncbroker-app:sha-174334b
    container_name: solar_sync_app
    ports:
      - "8082:8081"
    environment:
      DB_URL: jdbc:mysql://mysql-server:3306/solar_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME:?seteaza DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?seteaza DB_PASSWORD in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?seteaza JWT_SECRET_KEY in .env}
    depends_on:
      mysql-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
