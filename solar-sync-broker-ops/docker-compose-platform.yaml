services:
  mysql-server:
    image: mysql:8.4
    container_name: mysql_server
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  solar-sync-app:
    image: sebi123q/solarsyncbroker-app:sha-ab9dce1
    container_name: solar_sync_app
    ports:
      - "8082:8081"
    environment:
      DB_URL: jdbc:mysql://mysql-server:3306/solar_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      mysql-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
