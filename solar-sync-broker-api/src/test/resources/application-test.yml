spring:
  datasource:
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        globally_quoted_identifiers: true
  liquibase:
    enabled: false
  flyway:
    enabled: false

application:
  jwt:
    # Valoare falsa, doar pentru teste (nu e secretul real).
    secretKey: test-only-fake-jwt-key-0123456789-0123456789-0123456789-0123456789-abcdef
