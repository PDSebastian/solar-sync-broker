spring:
  application:
    name: solar-sync-broker-api
  datasource:
    url: jdbc:mysql://localhost:3307/solarsyncbroker_db?createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    # Bazele vechi au fost create de Hibernate (ddl-auto: update), deci nu au flyway_schema_history.
    # Fara asta Flyway refuza sa porneasca ("Found non-empty schema(s) ... no schema history table").
    # Pe o baza goala ruleaza migratiile normal; pe una existenta o marcheaza la versiunea de baza (1).
    baseline-on-migrate: true

logging:
  level:
    root: warn
    org.flywaydb: info

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

application:
  jwt:
    secretKey: ${JWT_SECRET_KEY:dev-only-solarsync-secret-key-please-change-in-prod-0123456789ABCDEF}
    tokenExpirationAfterDays: 7

solarsync:
  simulation:
    seed: 42
    tick-seconds: 60
    real-to-virtual-ratio: 60
  grid:
    transformer-nominal-kw: 50
    safety-margin-percent: 10
  agent:
    mode: ADVISORY
    planning-interval-seconds: 300
